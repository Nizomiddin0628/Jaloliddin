{# Boshqaruv sahifalari uchun umumiy uslub — bir joyda saqlanadi #}
<style>
  .wui-wrap { max-width: 1100px; }

  .wui-back,
  a.wui-back:link,
  a.wui-back:visited {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #2f6b4f;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 18px;
  }
  a.wui-back:hover { text-decoration: underline; }

  .wui-btn,
  a.wui-btn:link,
  a.wui-btn:visited,
  button.wui-btn {
    display: inline-block;
    background: #2f6b4f;
    color: #fff;
    padding: 10px 18px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.2;
    border: 0;
    cursor: pointer;
  }
  .wui-btn:hover,
  a.wui-btn:hover,
  a.wui-btn:focus { background: #24523c; color: #fff; text-decoration: none; }

  .wui-btn--soft,
  a.wui-btn--soft:link,
  a.wui-btn--soft:visited {
    background: #fff;
    color: #2f6b4f;
    border: 1px solid #cfd9d2;
  }
  a.wui-btn--soft:hover { background: #f1f6f3; color: #24523c; }

  .wui-head {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .wui-head h1 { margin: 0; font-size: 24px; }
  .wui-sub { color: #6b7280; margin: 0 0 26px; font-size: 14px; }

  .wui-empty {
    padding: 56px 24px;
    text-align: center;
    color: #6b7280;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    line-height: 1.6;
  }

  /* Kishilar kartochkasi */
  .wui-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }
  .wui-card,
  a.wui-card:link,
  a.wui-card:visited {
    display: block;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  a.wui-card:hover {
    box-shadow: 0 6px 20px rgba(0,0,0,.1);
    transform: translateY(-2px);
    text-decoration: none;
  }
  .wui-card__cover {
    height: 150px;
    background: #eef1ef;
    display: grid;
    place-items: center;
    font-size: 36px;
    color: #9aa3a0;
  }
  .wui-card__cover img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .wui-card__body { padding: 14px 16px 16px; }
  .wui-card__name { font-size: 16px; font-weight: 700; margin: 0 0 5px; }
  .wui-card__meta { font-size: 13px; color: #6b7280; margin: 0; line-height: 1.55; }
  .wui-card__open { font-size: 13px; color: #2f6b4f; font-weight: 600; margin-top: 10px; }

  /* Fayllar to'ri */
  .wui-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .wui-item {
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
  }
  .wui-open {
    display: block; width: 100%; padding: 0; border: 0;
    background: #eef1ef; cursor: zoom-in;
  }
  .wui-open img, .wui-open video {
    width: 100%; height: 145px; object-fit: cover; display: block;
  }
  .wui-item__nm {
    font-size: 11px; color: #6b7280; padding: 7px 9px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wui-item__dl,
  .wui-item a.wui-item__dl:link,
  .wui-item a.wui-item__dl:visited {
    display: block; text-align: center; padding: 8px; margin-top: 7px;
    font-size: 12px; font-weight: 600; color: #2f6b4f;
    background: #f4f7f5; border-top: 1px solid #eef1ef; text-decoration: none;
  }
  .wui-item a.wui-item__dl:hover { background: #e6efe9; }

  /* Kattalashtirilgan ko'rinish */
  #wui-box {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,.92); align-items: center; justify-content: center;
    padding: 20px;
  }
  #wui-box.on { display: flex; }
  #wui-box img, #wui-box video { max-width: 100%; max-height: 86vh; object-fit: contain; }
  #wui-close {
    position: absolute; top: 10px; right: 16px; font-size: 36px; line-height: 1;
    color: #fff; background: none; border: 0; cursor: pointer;
  }
  #wui-prev, #wui-next {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 30px; color: #fff; background: rgba(255,255,255,.12);
    border: 0; cursor: pointer; padding: 14px 18px; border-radius: 6px;
  }
  #wui-prev { left: 12px; }
  #wui-next { right: 12px; }

  @media (max-width: 600px) {
    .wui-cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .wui-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    .wui-open img, .wui-open video { height: 110px; }
  }
</style>
