{# Xiva uslubidagi o'yma eshikning bir tavaqasi. O'ng tavaqa CSS bilan ko'zgu qilinadi. #}
<svg class="door__art door__art--tall" viewBox="0 0 220 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="220" height="640" fill="var(--door-wood)"/>
  <rect x="0" y="0" width="220" height="640" fill="url(#girih)" class="door__grain"/>
  <g fill="none" stroke="url(#brass)">
    <rect x="14" y="14" width="192" height="612" stroke-width="2.2"/>
    <rect x="24" y="24" width="172" height="592" stroke-width=".9" opacity=".6"/>
    {# Tepadagi kamar #}
    <path d="M40 210 V120 Q40 50 110 40 Q180 50 180 120 V210 Z" stroke-width="1.8"/>
    <path d="M52 200 V124 Q52 64 110 54 Q168 64 168 124 V200 Z" stroke-width=".8" opacity=".7"/>
    {# O'rtadagi katta panel #}
    <rect x="40" y="236" width="140" height="250" stroke-width="1.8"/>
    <rect x="50" y="246" width="120" height="230" stroke-width=".8" opacity=".7"/>
    {# Pastki panel #}
    <rect x="40" y="512" width="140" height="92" stroke-width="1.8"/>
  </g>
  {# Kamar ichidagi rozetka #}
  <g transform="translate(110 132)" fill="none" stroke="url(#brass)" stroke-width="1.4">
    <rect x="-22" y="-22" width="44" height="44"/>
    <rect x="-22" y="-22" width="44" height="44" transform="rotate(45)"/>
    <circle r="9"/>
    <circle r="3" fill="url(#brass)"/>
  </g>
  <g transform="translate(110 558)" fill="none" stroke="url(#brass)" stroke-width="1.2" opacity=".85">
    <rect x="-16" y="-16" width="32" height="32"/>
    <rect x="-16" y="-16" width="32" height="32" transform="rotate(45)"/>
  </g>
  {# Mis halqa — eshikning ichki chetida #}
  <g transform="translate(198 360)">
    <circle r="7" fill="url(#brass)"/>
    <circle cy="22" r="16" fill="none" stroke="url(#brass)" stroke-width="3.2"/>
  </g>
</svg>

{# Kompyuter uchun keng tavaqa — naqsh cho'zilib ketmasligi uchun alohida chizilgan #}
